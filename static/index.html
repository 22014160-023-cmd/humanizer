<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Humanizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #58a6ff; --accent-hover: #79b8ff; --error: #f85149; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  header { max-width: 1400px; margin: 0 auto 24px; display: flex;
    align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .status { font-size: 13px; color: var(--muted); }
  .container { max-width: 1400px; margin: 0 auto; display: grid;
    grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
  .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; font-weight: 500; }
  .counter { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .counter.over { color: var(--error); }
  textarea, .output { width: 100%; min-height: 500px; padding: 18px;
    background: transparent; color: var(--text); border: none; outline: none;
    font-family: inherit; font-size: 14px; line-height: 1.7; resize: none; }
  .output { white-space: pre-wrap; overflow-y: auto; max-height: 600px; }
  .output:empty::before { content: "Humanized output will appear here..."; color: var(--muted); }
  .actions { padding: 14px 18px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px; font-weight: 500;
    cursor: pointer; font-family: inherit; transition: all 0.15s; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0d1117; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: #0d1117; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .progress { flex: 1; font-size: 13px; color: var(--muted); min-width: 150px; }
  .spinner { display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: var(--error); font-size: 13px; }
</style>
</head>
<body>
  <header>
    <h1>Human<span>izer</span></h1>
    <div class="status">Academic paper rewriter &middot; 3000 word limit</div>
  </header>
  <div class="container">
    <div class="panel">
      <div class="panel-header">
        <span>Input (AI text)</span>
        <span class="counter" id="in-counter">0 / 3000 words</span>
      </div>
      <textarea id="input" placeholder="Paste AI-generated academic text here..."></textarea>
      <div class="actions">
        <button class="primary" id="go-btn">Humanize</button>
        <button id="clear-btn">Clear</button>
        <div class="progress" id="progress"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <span>Output (Humanized)</span>
        <span class="counter" id="out-counter">0 words</span>
      </div>
      <div class="output" id="output"></div>
      <div class="actions">
        <button id="copy-btn">Copy</button>
        <button id="download-btn">Download .txt</button>
      </div>
    </div>
  </div>
<script>
const input = document.getElementById("input");
const output = document.getElementById("output");
const goBtn = document.getElementById("go-btn");
const clearBtn = document.getElementById("clear-btn");
const copyBtn = document.getElementById("copy-btn");
const downloadBtn = document.getElementById("download-btn");
const progress = document.getElementById("progress");
const inCounter = document.getElementById("in-counter");
const outCounter = document.getElementById("out-counter");
const MAX_WORDS = 3000;

function countWords(s) { return s.trim() ? s.trim().split(/\s+/).length : 0; }

input.addEventListener("input", () => {
  const w = countWords(input.value);
  inCounter.textContent = `${w} / ${MAX_WORDS} words`;
  inCounter.classList.toggle("over", w > MAX_WORDS);
});

goBtn.addEventListener("click", async () => {
  const text = input.value.trim();
  if (!text) return;
  if (countWords(text) > MAX_WORDS) {
    progress.innerHTML = '<span class="error">Text exceeds 3000 words</span>';
    return;
  }
  goBtn.disabled = true;
  output.textContent = "";
  outCounter.textContent = "0 words";
  const startTime = Date.now();
  let timer = setInterval(() => {
    const s = Math.floor((Date.now() - startTime) / 1000);
    progress.innerHTML = `<span class="spinner"></span>Processing... ${s}s`;
  }, 500);
  try {
    const res = await fetch("/api/humanize", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text}),
    });
    const data = await res.json();
    clearInterval(timer);
    if (!res.ok) {
      progress.innerHTML = `<span class="error">${data.detail || "Error"}</span>`;
      return;
    }
    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    output.textContent = data.output;
    outCounter.textContent = `${data.words_out} words`;
    progress.textContent = `Done in ${elapsed}s · ${data.paragraphs} paragraphs`;
  } catch (e) {
    clearInterval(timer);
    progress.innerHTML = `<span class="error">${e.message}</span>`;
  } finally {
    goBtn.disabled = false;
  }
});

clearBtn.addEventListener("click", () => {
  input.value = "";
  output.textContent = "";
  inCounter.textContent = `0 / ${MAX_WORDS} words`;
  outCounter.textContent = "0 words";
  progress.textContent = "";
});

copyBtn.addEventListener("click", async () => {
  if (!output.textContent) return;
  await navigator.clipboard.writeText(output.textContent);
  copyBtn.textContent = "Copied!";
  setTimeout(() => copyBtn.textContent = "Copy", 1500);
});

downloadBtn.addEventListener("click", () => {
  if (!output.textContent) return;
  const blob = new Blob([output.textContent], {type: "text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "humanized.txt";
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
